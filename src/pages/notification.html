<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Alert - mousing</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.json">

  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="/assets/styles.css" rel="stylesheet">
  <script src="/assets/api.js"></script>
  <script src="/assets/lightning-lane-form.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body class="bg-gray-50 text-gray-900 min-h-screen" x-data="notificationApp" x-cloak>

  <header class="sticky top-0 z-50 bg-white border-b border-gray-200">
    <div class="max-w-5xl mx-auto px-4 h-14 flex items-center gap-3">
      <a href="/" aria-label="Back to mousing" class="p-1 -ml-1 text-gray-400 hover:text-gray-700 rounded-md transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
      </a>
      <h1 class="text-lg font-bold text-gray-900 tracking-tight">Alert</h1>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-6 space-y-4">
    <template x-if="loading">
      <p class="text-sm text-gray-500">Loading the alert...</p>
    </template>

    <template x-if="error">
      <div class="p-4 bg-white rounded-xl border border-gray-100 text-sm">
        <p class="text-red-700" x-text="error"></p>
        <a href="/" class="inline-block mt-3 text-blue-600">Back to mousing</a>
      </div>
    </template>

    <template x-if="notif">
      <section class="bg-white rounded-xl border border-gray-100 p-5 space-y-4" aria-labelledby="alert-title">
        <div>
          <h2 id="alert-title" class="text-base font-semibold text-gray-900" x-text="notif.watch_name"></h2>
          <p class="text-xs text-gray-400 mt-0.5" x-text="'Sent ' + sentAt(notif.sent_at)"></p>
        </div>

        <ul class="divide-y divide-gray-50">
          <template x-for="match in notif.matches" :key="match.roomCode">
            <li class="py-3">
              <p class="text-sm font-medium text-gray-900" x-text="match.resort"></p>
              <p class="text-sm text-green-700 font-semibold" x-text="'Return ' + match.return_label"></p>
              <p class="text-xs text-gray-500" x-text="details(match)"></p>
            </li>
          </template>
        </ul>

        <a :href="appLink.url" target="_blank" rel="noopener"
          class="block w-full text-center px-4 py-2.5 bg-blue-600 text-white text-sm font-semibold rounded-lg hover:bg-blue-700"
          x-text="appLink.label"></a>
        <p class="text-xs text-gray-400">Return times change quickly. Book in the app to hold one.</p>
      </section>
    </template>
  </main>

  <script>
  document.addEventListener("alpine:init", () => {
    Alpine.data("notificationApp", () => ({
      loading: true,
      error: "",
      notif: null,
      appLink: LightningLaneForm.disneyAppLink(navigator.userAgent, navigator.maxTouchPoints),

      async init() {
        const id = new URLSearchParams(location.search).get("id");
        if (!id) {
          this.error = "This link has no alert in it.";
          this.loading = false;
          return;
        }
        try {
          const res = await Mousing.api(`/api/notifications/${encodeURIComponent(id)}`);
          const data = await res.json();
          if (!res.ok) throw new Error(res.status === 404 ? "This alert has expired. Alerts are kept for 30 days." : data.error);
          this.notif = data;
        } catch (e) {
          this.error = e.message || "Could not load the alert.";
        } finally {
          this.loading = false;
        }
      },

      sentAt(iso) {
        return new Date(iso).toLocaleString([], { dateStyle: "medium", timeStyle: "short" });
      },

      details(match) {
        const parts = [match.roomType];
        if (match.price != null) parts.push("$" + match.price.toFixed(2));
        if (match.standby_wait != null) parts.push("standby " + match.standby_wait + " min");
        return parts.join(" · ");
      },
    }));
  });
  </script>

</body>
</html>
