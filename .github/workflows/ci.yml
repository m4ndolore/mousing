name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Page script syntax
        run: npm run check:pages
      - name: Cloudflare builds (Pages Functions, cron worker)
        run: npm run check:build
        env:
          WRANGLER_SEND_METRICS: "false"
